<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organigrama SPS</title>
  <link rel="stylesheet" href="./style.css?v=3">
</head>

<body>
<div class="contenedor-svg">

<svg viewBox="0 0 1400 760" class="organigrama-svg">

  <defs>

      <path d="M0,0 L0,6 L9,3 z" fill="#2f3192"/>

  <line x1="700" y1="90" x2="700" y2="160" class="linea"/>

  <line x1="120" y1="320" x2="1280" y2="320" class="linea"/>

  <line x1="805" y1="485" x2="805" y2="520" class="linea flecha"/>

  <g class="caja blanca"><rect x="880" y="520" width="100" height="60"/><text x="930" y="540">Unidad de</text><text x="930" y="555">Adquisiciones y</text><text x="930" y="570">Servicios Generales</text></g>
